<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MJIA">
<meta name="robots" content="noindex, nofollow">
<title>MJIA — Investimentos & Análise</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234d8dff'/%3E%3Cstop offset='1' stop-color='%239b7bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M14 44 L26 30 L34 37 L50 20' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --bg2:#10131a; --card:#151922; --card2:#1b2030; --line:#252b3b; --line2:#30374a;
  --tx:#eef1f6; --tx2:#b7bfd0; --mut:#8a93a8; --mut2:#646d82;
  --blue:#4d8dff; --blue2:#2f6fe8; --green:#2fd27a; --red:#ff5a5f; --yellow:#f6c94c; --purple:#9b7bff;
  --gbg:rgba(47,210,122,.12); --rbg:rgba(255,90,95,.12); --ybg:rgba(246,201,76,.12); --bbg:rgba(77,141,255,.13);
  --r:18px; --r2:12px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num,.big,.mono{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:22px} h3{font-size:17px} h4{font-size:14px;color:var(--tx2);font-weight:600}
p{margin:.5em 0}
code{background:var(--card2);padding:1px 6px;border-radius:6px;font-size:.92em}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(12px + var(--st)) 14px calc(96px + var(--sb));max-width:980px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-weight:800;font-size:10px;letter-spacing:0}
.brand b{font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:11.5px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,17,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--sb))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11px;padding:6px 0;border-radius:12px;min-height:48px;justify-content:center}
.tabbar a .ic{font-size:20px;line-height:1}
.tabbar a.on{color:var(--tx)}
.tabbar a.on .ic{filter:none}
.disclaimer{color:var(--mut2);font-size:11.5px;text-align:center;margin:22px 0 4px}
@media (min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:256px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--bg2)}
  .side .brand{margin:0 6px 18px}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:14px;border-radius:12px;color:var(--tx2);font-weight:500}
  .side a:hover{background:var(--card)}
  .side a.on{background:var(--card2);color:var(--tx)}
  .side a .soon{margin-left:auto}
  .side .sep{height:1px;background:var(--line);margin:10px 6px}
  .main{padding:26px 32px 40px}
  .topbar .brand{display:none}
}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:transparent}
.card h3{margin-bottom:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-h h3{margin:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
@media (min-width:700px){.g3{grid-template-columns:repeat(3,1fr)}.g2m{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--mut)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.mid{font-size:22px;font-weight:700}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--tx2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--tx2);white-space:nowrap}
.pill.up{background:var(--gbg);color:var(--green)} .pill.down{background:var(--rbg);color:var(--red)}
.pill.y{background:var(--ybg);color:var(--yellow)} .pill.b{background:var(--bbg);color:var(--blue)}
.soon{font-size:10.5px;font-weight:700;color:var(--mut);background:var(--card2);border:1px solid var(--line2);padding:1px 7px;border-radius:999px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;min-height:44px;text-align:center}
.btn:hover{background:var(--blue2)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line2)}
.btn.sec:hover{background:#232a3c}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px;min-height:36px}
.btn.danger{background:var(--rbg);color:var(--red);border:1px solid rgba(255,90,95,.3)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>.btn{flex:1 1 auto}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;min-height:34px}
.seg button.on{background:var(--line2);color:var(--tx)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--tx);cursor:pointer;min-height:56px}
.li:last-child{border-bottom:0}
.li:hover{background:rgba(255,255,255,.02)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex-shrink:0}
.av{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:11px;color:var(--tx2);flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;background:#fff}
.chev{color:var(--mut2)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.kv{grid-template-columns:repeat(3,1fr)}}
.kv .k{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;min-width:0}
.kv .k .l{color:var(--mut);font-size:12px}
.kv .k .v{font-weight:700;font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.src{color:var(--mut2);font-size:11.5px;margin-top:10px;line-height:1.4}
.src b{color:var(--mut);font-weight:600}
.nodata{color:var(--mut);font-style:italic}
.bar{height:10px;background:var(--card2);border-radius:999px;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:999px}
.bar>i.g{background:var(--green)} .bar>i.y{background:var(--yellow)}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--card2)}
.stack>i{display:block;height:100%}
.callout{background:var(--bbg);border:1px solid rgba(77,141,255,.25);border-radius:var(--r2);padding:12px 14px;margin:12px 0;font-size:14px}
.callout.warn{background:var(--ybg);border-color:rgba(246,201,76,.28)}
.callout.bad{background:var(--rbg);border-color:rgba(255,90,95,.3)}
.callout.ok{background:var(--gbg);border-color:rgba(47,210,122,.28)}
.banner{border-radius:var(--r2);padding:10px 14px;margin-bottom:12px;font-size:13.5px;background:var(--ybg);border:1px solid rgba(246,201,76,.28)}
.flag{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.flag:last-child{border-bottom:0}
.flag .e{font-size:18px;line-height:1.3}
.skel{background:linear-gradient(90deg,var(--card2),#222838,var(--card2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .e{font-size:34px}
table.mini,table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
table.mini th,table.mini td,table.tbl th,table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.mini th,table.tbl th{color:var(--mut);font-weight:600;font-size:12px}
table.tbl td.n,table.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lesson{font-size:15.5px;line-height:1.65}
.lesson ul,.lesson ol{padding-left:20px}
.lesson li{margin:6px 0}
.hidden{display:none!important}
.lock{opacity:.6}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* termo técnico + tooltip */
.term{border-bottom:1px dotted var(--mut);cursor:help;text-decoration:none;color:inherit}
.term:focus{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
#tip{position:fixed;z-index:100;max-width:320px;background:#20263a;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.45);color:var(--tx);pointer-events:auto}
#tip b{display:block;margin-bottom:3px;font-size:13.5px}

/* formulários */
label.f{display:block;margin:10px 0}
label.f>span{display:block;color:var(--tx2);font-size:13px;margin-bottom:5px;font-weight:500}
input.in,select.in,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;min-height:44px;font-size:16px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--blue)}
textarea.in{min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--red);font-size:13px;margin-top:6px}
.hint{color:var(--mut);font-size:12px;margin-top:4px}

/* folha (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);border:1px solid var(--line2);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + var(--sb));animation:up .18s ease-out}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{background:var(--card2);border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--tx2);font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));z-index:90;background:#263049;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw}
@media (min-width:900px){.toast{bottom:24px}}

/* gráfico */
.chart{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{width:100%;height:220px;display:block}
.chart .yl{position:absolute;right:0;font-size:11px;color:var(--mut);background:rgba(21,25,34,.8);padding:0 4px;border-radius:4px}
.chart .hov{position:absolute;top:0;pointer-events:none;background:#20263a;border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translateX(-50%)}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;margin:8px 0;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--gbg)}
.opt.no{border-color:var(--red);background:var(--rbg)}
.opt:disabled{cursor:default}
.hero{background:linear-gradient(160deg,#18203a,#121725 60%);border:1px solid var(--line2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.secttl{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;color:var(--tx2);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

</style>
</head>
<body>
<noscript>A MJIA precisa de JavaScript.</noscript>
<script>
'use strict';
/* ===== MJIA — conteúdo estático (glossário, universo, textos educativos) ===== */
const APP_VERSION = '1.0.0';
const CONTENT_DATE = 'nov. 2026';

/* Glossário: cada termo técnico tem uma explicação curta (rato ou toque). */
const GLOSSARY = {
  'acao': ['Ação', 'Uma pequena parte de uma empresa. Se a empresa cresce ou distribui lucros, ganhas com isso. Se corre mal, a ação pode perder valor, no limite até zero.'],
  'etf': ['ETF (Exchange-Traded Fund)', 'Fundo negociado em bolsa que guarda um cesto de ativos (por exemplo, as 500 maiores empresas dos EUA). Compras uma unidade e ficas exposto a todo o cesto de uma vez.'],
  'ucits': ['UCITS', 'Regras europeias para fundos de investimento: diversificação mínima, proteção do investidor e um documento KID obrigatório. Os ETFs UCITS são os que um investidor particular na UE pode comprar.'],
  'kid': ['KID', 'Documento de Informações Fundamentais: resumo obrigatório com custos, risco (1 a 7) e cenários. Muitos ETFs americanos não o publicam, por isso as corretoras da UE não os podem vender a particulares.'],
  'isin': ['ISIN', 'Código internacional de 12 caracteres que identifica um título (ex.: IE00B5BMR087). É mais fiável do que o ticker, que muda de bolsa para bolsa.'],
  'ticker': ['Ticker', 'Código curto de um título na bolsa (ex.: AAPL = Apple).'],
  'ter': ['TER (custo total anual)', 'Custo anual de um fundo em % do valor investido. É descontado automaticamente, não vês uma cobrança à parte.'],
  'acumulacao': ['Acumulação (Acc)', 'O fundo reinveste os dividendos dentro do próprio fundo em vez de os pagar a ti.'],
  'distribuicao': ['Distribuição (Dist)', 'O fundo paga-te os dividendos em dinheiro, normalmente de 3 em 3 meses.'],
  'domicilio': ['Domicílio', 'País onde o fundo está registado (ex.: Irlanda). Influencia os impostos retidos sobre dividendos e as regras aplicáveis.'],
  'etc': ['ETC', 'Exchange-Traded Commodity: título negociado em bolsa que acompanha uma matéria-prima (ex.: ouro guardado em cofre). Juridicamente é dívida do emitente, não é um fundo UCITS.'],
  'adr': ['ADR', 'Certificado que permite negociar nos EUA, em dólares, ações de uma empresa estrangeira (ex.: ASML, TSMC).'],
  'reit': ['REIT', 'Sociedade que possui imóveis para arrendar e que, por lei, distribui a maior parte dos lucros como dividendos.'],
  'conglomerado': ['Conglomerado', 'Empresa-mãe que controla muitos negócios diferentes.'],
  'indice': ['Índice', 'Lista de empresas usada para medir um mercado (ex.: S&P 500). Não se compra diretamente; compra-se um ETF que o replica.'],
  'sp500': ['S&P 500', 'Índice com cerca de 500 das maiores empresas dos EUA, ponderadas pela dimensão.'],
  'nasdaq100': ['Nasdaq-100', 'Índice com as 100 maiores empresas não financeiras cotadas na bolsa Nasdaq. Tem muito peso em tecnologia.'],
  'bloco-alto': ['Bloco de alto risco', 'Parte do teu dinheiro (até 150 €) para apostas voláteis e para aprender. Assume que pode perder muito valor.'],
  'bloco-longo': ['Bloco de longo prazo', 'Parte do teu dinheiro para crescer devagar durante anos (ETFs e empresas sólidas).'],
  'cotacao': ['Cotação', 'Último preço a que o título foi negociado. Com a bolsa fechada é o preço de fecho.'],
  'variacao': ['Variação diária', 'Diferença entre a cotação atual e o fecho do dia anterior, em valor e em %.'],
  'market-cap': ['Capitalização bolsista (market cap)', 'Valor total da empresa em bolsa = preço × número de ações. Mega: > 200 mil M$; grande: 10–200 mil M$; média: 2–10 mil M$; pequena: < 2 mil M$.'],
  'pe': ['P/E (preço / lucro)', 'Quanto pagas por cada 1 $ de lucro anual. Um P/E de 25 significa 25 $ por 1 $ de lucro. Um valor alto pode indicar expectativas de crescimento ou uma ação cara: compara com o setor e com o histórico da empresa. Se o lucro for negativo, o P/E não tem significado.'],
  'ps': ['P/S (preço / vendas)', 'Valor em bolsa dividido pelas receitas anuais. É útil quando a empresa ainda não tem lucro.'],
  'eps': ['EPS (lucro por ação)', 'Lucro líquido dividido pelo número de ações.'],
  'ttm': ['TTM', 'Últimos 12 meses (trailing twelve months): soma dos últimos quatro trimestres.'],
  'yoy': ['a/a (ano a ano)', 'Comparação com o mesmo período do ano anterior.'],
  'crescimento-receitas': ['Crescimento das receitas', 'Quanto as vendas subiram face ao ano anterior. Mostra se o negócio está a crescer.'],
  'crescimento-eps': ['Crescimento do EPS', 'Quanto o lucro por ação subiu face ao ano anterior.'],
  'margem-bruta': ['Margem bruta', 'Receitas menos o custo direto dos produtos, em %. Indica o poder de preço.'],
  'margem-op': ['Margem operacional', 'Lucro das operações (antes de juros e impostos) em % das receitas.'],
  'margem-liquida': ['Margem líquida', 'Lucro final em % das receitas. Uma margem de 25% significa 25 cêntimos de lucro por cada 1 $ vendido.'],
  'roe': ['ROE (rentabilidade do capital próprio)', 'Lucro em % do capital dos acionistas. Mostra a eficiência com que a empresa usa o dinheiro dos donos. Com muita dívida o ROE fica artificialmente alto.'],
  'divida-capital': ['Dívida / capital próprio', 'Dívida total a dividir pelo capital dos acionistas. 0,5x é pouca dívida; acima de 2x é muita, salvo em bancos e utilities, onde é normal.'],
  'dividendo': ['Dividendo', 'Parte do lucro paga em dinheiro aos acionistas.'],
  'rendimento-dividendo': ['Rendimento do dividendo (dividend yield)', 'Dividendos anuais a dividir pelo preço da ação. 3% significa receber cerca de 3 € por ano por cada 100 € investidos, antes de impostos.'],
  'ex-dividendo': ['Data ex-dividendo', 'Para receber o próximo dividendo tens de ter a ação antes desta data. Neste dia o preço costuma descer aproximadamente o valor do dividendo.'],
  'data-pagamento': ['Data de pagamento', 'Dia em que o dividendo chega à conta.'],
  'beta': ['Beta', 'Quanto a ação costuma mexer face ao mercado. Beta 1 acompanha o mercado; 1,5 tende a mexer 50% mais; 0,5 mexe metade.'],
  'volatilidade': ['Volatilidade anualizada', 'Mede a intensidade das oscilações do preço. A MJIA calcula-a com os preços diários de 1 ano. Cerca de 15% é típico de um índice amplo; acima de 50% é muito volátil.'],
  'drawdown': ['Queda máxima (drawdown)', 'A maior descida de um pico até ao ponto mais baixo seguinte no período. Mostra o pior cenário que já aconteceu.'],

  { id: 'l1-1', t: 'O que compras: ações, ETFs e obrigações', min: 4, h: `
<p>Quando compras uma <b>[[acao|ação]]</b> ficas dono de uma pequena parte de uma empresa. Se a empresa lucra e cresce, a ação tende a valorizar e pode pagar <b>[[dividendo|dividendos]]</b>. Se corre mal, o preço cai, e no limite (falência) podes perder tudo o que investiste <i>nessa</i> ação.</p>
<p>Um <b>[[etf|ETF]]</b> é um fundo que guarda um cesto de ativos e que se compra e vende na bolsa como uma ação. Um ETF do <b>[[sp500|S&P 500]]</b>, por exemplo, dá-te um bocadinho de cerca de 500 empresas de uma só vez. É a forma mais simples de <b>[[diversificacao|diversificar]]</b>.</p>

<p>Uma <b>[[obrigacao|obrigação]]</b> é um empréstimo: emprestas dinheiro a um Estado ou a uma empresa e recebes juros. O risco é que o emitente não pague, e o preço da obrigação também mexe quando as taxas de juro mudam (se os juros sobem, as obrigações antigas valem menos).</p>

  { id: 'l1-2', t: 'Poupar com pouco risco: depósitos, Certificados de Aforro e PPR', min: 4, h: `
<p>Antes da bolsa, convém conhecer as alternativas de baixo risco em Portugal. Servem de comparação: se uma ação não te parece capaz de render claramente mais do que isto, o risco pode não compensar.</p>
<p><b>[[deposito-prazo|Depósito a prazo]]</b>: dinheiro parado num banco durante um prazo, com juro fixo. Está protegido até 100 000 € por pessoa e por banco pelo <b>[[fgd|Fundo de Garantia de Depósitos]]</b>. Os juros pagam 28% de IRS (taxa liberatória), retidos automaticamente.</p>
<p><b>[[certificados-aforro|Certificados de Aforro]]</b> (Série F): dívida do Estado para particulares, com a taxa ligada à <b>[[euribor|Euribor]]</b> a 3 meses e um teto de 2,5% na taxa base. Para subscrições de novembro de 2026, a taxa bruta está no teto de 2,500% (cerca de 1,8% líquidos depois de IRS), segundo o IGCP. A partir do 2.º ano há prémios de permanência. Só podes levantar depois do primeiro vencimento de juros (3 meses).</p>
<p><b>[[ppr|PPR]]</b>: poupança para a reforma com benefício fiscal (dedução à coleta de IRS de 20% do valor aplicado, com limites por idade). <b>Atenção:</b> se ainda não pagas IRS, o benefício pode ser zero, e levantar fora das condições previstas na lei tem penalizações.</p>

<p><b>[[risco-retorno|Risco e retorno andam juntos.]]</b> Ações tiveram historicamente retornos médios mais altos do que depósitos, mas com anos de quedas fortes (−20%, −30% ou pior). Ninguém consegue ter retorno alto sem risco. Quem promete o contrário está a enganar-te.</p>

  { id: 'l1-4', t: 'Diversificação e investimento periódico (DCA)', min: 3, h: `

  { id: 'l1-5', t: 'Tipos de ordens e horário da bolsa', min: 5, h: `

<li><b>[[ordem-mercado|Ordem de mercado]]</b>: executa já, ao melhor preço disponível. É simples, mas numa ação muito volátil ou fora de horas o preço pode ser pior do que esperavas.</li>
<li><b>[[ordem-limite|Ordem limite]]</b>: "compra só a 100 $ ou menos" (ou "vende só a 120 $ ou mais"). Controlas o preço, mas a ordem pode nunca ser executada.</li>
<li><b>[[ordem-stop|Ordem stop]]</b> (stop-loss): "se cair até 90 $, vende". Ao tocar nos 90 $ passa a ordem de mercado; numa queda brusca pode vender a 85 $.</li>

const RECENT = {};

function preflight(api, prio) {
  const A = APIS[api];
  if (IN_ARTIFACT) throw new ApiError('blocked', api);
  if (A.keyParam && !KEYS[api]) throw new ApiError('nokey', api);
  if (A.perDay) {

}

const Q = []; let qActive = 0, qTimer = null, qSeq = 0;
const Q_MAX = 4;
function enqueue(job) { return new Promise((resolve, reject) => { Q.push({ ...job, resolve, reject, seq: qSeq++ }); pump(); }); }
function pump() {

  Q.sort((a, b) => b.prio - a.prio || a.seq - b.seq);
  let wait = Infinity;
  for (let i = 0; i < Q.length && qActive < Q_MAX;) {
    const j = Q[i], lim = APIS[j.api].perMin;
    if (lim && minuteCount(j.api) >= lim) { wait = Math.min(wait, MIN - (Date.now() - RECENT[j.api][0]) + 60); i++; continue; }
    Q.splice(i, 1); qActive++; RECENT[j.api].push(Date.now());
    runJob(j).then(j.resolve, j.reject).finally(() => { qActive--; pump(); onQueueChange(); });
  }

}
let onQueueChange = () => { };
function buildUrl(api, path, params) {

  if (A.keyParam) u.searchParams.set(A.keyParam, KEYS[api]);

}

  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
  bumpUsage(j.api);
  let res, body;
  try {
    res = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } });
    const txt = await res.text();
    try { body = JSON.parse(txt); } catch (e) { body = txt; }
  } catch (e) { noteErr(j.api, 'network'); throw new ApiError('network', j.api); }

}
function detectError(api, status, b) {
  if (status === 429) return 'limit';
  if (status === 401) return 'invalid';
  if (status === 402 || status === 403) return 'plan';
  /* só analisamos o texto quando a resposta tem forma de erro (nunca em dados válidos) */
  let msg = null;
  if (typeof b === 'string') msg = b || 'vazio';
  else if (b && typeof b === 'object' && !Array.isArray(b)) msg = b['Error Message'] || b.error || b.Note || b.Information || (api === 'fx' ? b.message : null) || null;
  if (msg) {

    if (/invalid api|api key is invalid|invalid apikey|demo api key|invalid token|wrong token/.test(low)) return 'invalid';
    if (/premium|subscription|restricted|special endpoint|not available under|access to this resource|upgrade/.test(low)) return 'plan';

  if (INFLIGHT.has(ck)) return INFLIGHT.get(ck);

  const q = QUOTES[ticker];
  if (q && validQuote(q)) return { px: q.c, ccy: 'USD', at: q.t ? q.t * 1000 : q.at, fetched: q.at, src: 'finnhub', dp: q.dp, label: 'Finnhub' };

/* ---------- carteira ---------- */
const BLOCKS = { alto: { name: 'Alto risco', icon: '⚡', term: 'bloco-alto' }, longo: { name: 'Longo prazo', icon: '🌱', term: 'bloco-longo' } };
function txFeesEUR(t) { if (!t.fees) return 0; if ((t.feesCcy || t.ccy) === 'EUR') return t.fees; return t.eurusd ? t.fees / t.eurusd : 0; }
function txRate(t) { return t.ccy === 'EUR' ? 1 : t.eurusd; }
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || '') < (b.createdAt || '') ? -1 : 1);

function computePortfolio(opt = {}) {
  const demo = !!opt.demo, excludeTx = opt.excludeTx;
  const fxNow = FX.latest?.rate ?? null;
  const txs = state.tx.filter(t => !!t.demo === demo && t.id !== excludeTx).slice().sort(byDate);
  const lots = {}, warnings = [];
  const realized = { total: 0, price: 0, fx: 0, fees: 0, items: [] };
  const blk = { alto: mkBlock(), longo: mkBlock() };
  function mkBlock() { return { cash: 0, dep: 0, wd: 0, tin: 0, tout: 0, posValue: 0, posCost: 0, missing: 0, n: 0 }; }
  if (!demo) for (const m of state.cash) {
    if (m.kind === 'deposit') { blk[m.block].cash += m.amount; blk[m.block].dep += m.amount; }
    else if (m.kind === 'withdraw') { blk[m.block].cash -= m.amount; blk[m.block].wd += m.amount; }
    else if (m.kind === 'transfer') { blk[m.from].cash -= m.amount; blk[m.from].tout += m.amount; blk[m.to].cash += m.amount; blk[m.to].tin += m.amount; }
  }
  for (const t of txs) {
    const r = txRate(t), fee = txFeesEUR(t), key = t.block + '|' + t.ticker;
    const B = blk[t.block] || (blk[t.block] = mkBlock());
    if (t.kind === 'buy') {
      (lots[key] ||= []).push({ id: t.id, date: t.date, qty: t.qty, px: t.price, ccy: t.ccy, r, feeU: fee / t.qty, broker: t.broker });
      B.cash -= t.qty * t.price / r + fee;
    } else {
      const L = lots[key] || [];
      const held = sum(L, l => l.qty);
      let q = t.qty;
      if (q > held + 1e-9) { warnings.push({ tx: t.id, msg: `Venda de ${fmtQty(t.qty)} ${t.ticker} em ${t.date} é maior do que a posição nessa data (${fmtQty(held)}).` }); q = held; }
      if (L.length && L[0].ccy !== t.ccy) warnings.push({ tx: t.id, msg: `Venda de ${t.ticker} em ${t.ccy}, mas a compra foi em ${L[0].ccy}.` });
      B.cash += q * t.price / r - fee;
      const it = { tx: t.id, ticker: t.ticker, block: t.block, date: t.date, qty: q, price: 0, fx: 0, fees: fee };
      while (q > 1e-12 && L.length) {
        const l = L[0], take = Math.min(q, l.qty);
        it.price += take * (t.price - l.px) / l.r;
        it.fx += take * t.price * (1 / r - 1 / l.r);
        it.fees += take * l.feeU;
        l.qty -= take; q -= take;
        if (l.qty <= 1e-12) L.shift();
      }
      it.total = it.price + it.fx - it.fees;
      realized.items.push(it); realized.price += it.price; realized.fx += it.fx; realized.fees += it.fees;
    }
  }
  realized.total = realized.price + realized.fx - realized.fees;
  const positions = [];
  for (const [key, L] of Object.entries(lots)) {
    const qty = sum(L, l => l.qty);
    if (qty <= 1e-9) continue;
    const [block, ticker] = key.split('|');
    const ccy = L[0].ccy;
    const costEUR = sum(L, l => l.qty * l.px / l.r + l.qty * l.feeU);
    const feesEUR = sum(L, l => l.qty * l.feeU);
    const avgPx = sum(L, l => l.qty * l.px) / qty;
    const p = priceFor(ticker);
    let px = null, valueEUR = null, priceEff = null, fxEff = null;
    const rNow = ccy === 'EUR' ? 1 : fxNow;
    if (p && isNum(rNow)) {
      px = p.ccy === ccy ? p.px : (p.ccy === 'EUR' ? p.px * rNow : p.px / rNow); // converte para a moeda da posição
      valueEUR = qty * px / rNow;
      priceEff = sum(L, l => l.qty * (px - l.px) / l.r);
      fxEff = sum(L, l => l.qty * px * (1 / rNow - 1 / l.r));
    }
    const pos = { key, ticker, block, qty, ccy, lots: L, costEUR, feesEUR, avgPx, price: p, px, valueEUR, priceEff, fxEff, gainEUR: valueEUR == null ? null : valueEUR - costEUR };
    pos.gainPct = pos.gainEUR == null ? null : pos.gainEUR / costEUR * 100;
    positions.push(pos);
    const B = blk[block]; B.n++; B.posCost += costEUR;
    if (valueEUR == null) B.missing++; else B.posValue += valueEUR;
  }
  const known = positions.filter(p => p.valueEUR != null);
  const tot = {
    cash: blk.alto.cash + blk.longo.cash,
    posValue: sum(known, p => p.valueEUR),
    missing: positions.length - known.length,
    dep: blk.alto.dep + blk.longo.dep, wd: blk.alto.wd + blk.longo.wd,
    unrealGain: sum(known, p => p.gainEUR), unrealPrice: sum(known, p => p.priceEff), unrealFx: sum(known, p => p.fxEff), unrealFees: sum(known, p => p.feesEUR),
  };
  tot.invested = tot.dep - tot.wd;
  tot.value = tot.missing ? null : tot.cash + tot.posValue;
  tot.valueKnown = tot.cash + tot.posValue;
  tot.gain = tot.missing ? null : tot.value - tot.invested;
  tot.gainPct = tot.gain != null && tot.invested > 0 ? tot.gain / tot.invested * 100 : null;
  tot.priceEff = tot.unrealPrice + realized.price; tot.fxEff = tot.unrealFx + realized.fx; tot.fees = tot.unrealFees + realized.fees;
  for (const b of Object.values(blk)) { b.value = b.missing ? null : b.cash + b.posValue; b.allocated = b.dep - b.wd + b.tin - b.tout; }
  positions.sort((a, b) => (b.valueEUR ?? b.costEUR) - (a.valueEUR ?? a.costEUR));
  return { positions, blocks: blk, realized, tot, warnings, fxNow };
}
function heldQty(ticker, block, demo, excludeTx) { const P = computePortfolio({ demo, excludeTx }); const p = P.positions.find(p => p.ticker === ticker && p.block === block); return p ? p.qty : 0; }
function portfolioTickers() { return [...new Set(computePortfolio().positions.concat(computePortfolio({ demo: true }).positions).map(p => p.ticker))]; }

function goalStatus() {
  const g = state.settings.goal, P = computePortfolio();
  const saved = sum(state.savings, s => s.amount), realized = P.realized.total;
  const progress = saved + realized;
  const end = new Date(g.date + 'T23:59:59');
  const months = Math.max(0, (end.getFullYear() - new Date().getFullYear()) * 12 + end.getMonth() - new Date().getMonth());
  const missing = Math.max(0, g.target - progress);
  return { ...g, saved, realized, progress, pct: g.target > 0 ? Math.max(0, Math.min(100, progress / g.target * 100)) : 0, missing, months, perMonth: months > 0 ? missing / months : missing };
}

/* ---------- horário da bolsa dos EUA (convertido para Lisboa) ---------- */
function tzParts(date, tz) {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short' });
  const o = {}; for (const p of f.formatToParts(date)) o[p.type] = p.value; return o;
}
function tzOffsetMin(date, tz) { const p = tzParts(date, tz); return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - date.getTime()) / MIN; }
function zonedToUtc(y, m, d, hh, mm, tz) { const g = Date.UTC(y, m - 1, d, hh, mm); let t = g - tzOffsetMin(new Date(g), tz) * MIN; const o2 = tzOffsetMin(new Date(t), tz); t = g - o2 * MIN; return new Date(t); }
function marketHours(now = new Date()) {
  const ny = tzParts(now, 'America/New_York');
  const open = zonedToUtc(+ny.year, +ny.month, +ny.day, 9, 30, 'America/New_York');
  const close = zonedToUtc(+ny.year, +ny.month, +ny.day, 16, 0, 'America/New_York');
  const lis = d => { const p = tzParts(d, 'Europe/Lisbon'); return `${p.hour}h${p.minute}`; };
  const weekday = !['Sat', 'Sun'].includes(ny.weekday);
  const isOpen = weekday && now >= open && now < close;
  const normal = lis(open) === '14h30';
  return { open: lis(open), close: lis(close), isOpen, weekday, normal };
}

let TIP_EL = null, TIP_Y = 0;
function showTip(el) {
  const g = GLOSSARY[el.dataset.t]; if (!g) return;
  const tip = $('#tip'); tip.innerHTML = `<b>${esc(g[0])}</b>${esc(g[1])}`; tip.classList.remove('hidden');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.max(8, Math.min(r.left, innerWidth - tw - 8)), top = r.bottom + 8;
  if (top + th > innerHeight - 70) top = Math.max(8, r.top - th - 8);
  tip.style.left = left + 'px'; tip.style.top = top + 'px'; TIP_EL = el; TIP_Y = window.scrollY;
}
function hideTip() { const t = $('#tip'); if (t) t.classList.add('hidden'); TIP_EL = null; }
function wireTips() {
  let lastPT = 'mouse';
  document.addEventListener('pointerdown', e => { lastPT = e.pointerType; }, true);
  document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const t = e.target.closest?.('.term'); if (t && t !== TIP_EL) showTip(t); });
  document.addEventListener('pointerout', e => { if (e.pointerType !== 'mouse' || !TIP_EL) return; const to = e.relatedTarget; if (!to || !(to.closest?.('.term') === TIP_EL || to.closest?.('#tip'))) hideTip(); });
  document.addEventListener('click', e => {
    const t = e.target.closest?.('.term');
    if (t) { e.preventDefault(); e.stopPropagation(); if (TIP_EL === t && lastPT !== 'mouse') hideTip(); else showTip(t); return; }
    if (!e.target.closest?.('#tip')) hideTip();
  }, true);
  document.addEventListener('keydown', e => { const t = e.target.closest?.('.term'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); TIP_EL === t ? hideTip() : showTip(t); } if (e.key === 'Escape') hideTip(); });
  window.addEventListener('scroll', () => { if (TIP_EL && Math.abs(window.scrollY - TIP_Y) > 60) hideTip(); }, { passive: true });
}

function posRow(p, total) {

function positionsView(P, D) {

function movesView(P, D) {
  const items = [];
  for (const t of state.tx) items.push({ date: t.date, kind: 'tx', id: t.id, ic: t.kind === 'buy' ? '🟢' : '🔴', t: `${t.kind === 'buy' ? 'Compra' : 'Venda'} ${fmtQty(t.qty)} ${t.ticker}`, s: `${fmtMoney(t.price, t.ccy)}/ação${t.ccy === 'USD' ? ` · 1 € = ${fmtNum(t.eurusd, 4)} $` : ''}${t.fees ? ` · comissão ${fmtMoney(t.fees, t.feesCcy || t.ccy)}` : ''} · ${esc(t.broker)}${t.demo ? ' · demo' : ` · ${BLOCKS[t.block].name}`}`, v: (t.kind === 'buy' ? -1 : 1) * toEUR(t.qty * t.price, t.ccy, t.eurusd) });
  for (const m of state.cash) items.push({ date: m.date, kind: 'cash', id: m.id, ic: m.kind === 'deposit' ? '➕' : m.kind === 'withdraw' ? '➖' : '↔️', t: m.kind === 'deposit' ? `Reforço · ${BLOCKS[m.block].name}` : m.kind === 'withdraw' ? `Levantamento · ${BLOCKS[m.block].name}` : `Transferência ${BLOCKS[m.from].name} → ${BLOCKS[m.to].name}`, s: esc(m.note || ''), v: m.kind === 'withdraw' ? -m.amount : m.amount, neutral: m.kind === 'transfer' });

}
function diversView(P) {
  const ps = P.positions.filter(p => p.valueEUR != null), total = sum(ps, p => p.valueEUR);
  if (!ps.length) return `<div class="card empty"><div class="e">🧩</div>Sem posições com preço para analisar.</div>`;
  const group = f => { const m = {}; ps.forEach(p => { const k = f(p); m[k] = (m[k] || 0) + p.valueEUR; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const bars = (rows) => rows.map(([k, v]) => `<div style="margin:8px 0"><div class="row between small"><span>${esc(k)}</span><span class="num">${fmtPct(v / total * 100, 1, false)} · ${fmtEUR(v)}</span></div><div class="bar" style="height:7px"><i style="width:${v / total * 100}%"></i></div></div>`).join('');
  const sector = p => isEtf(p.ticker) ? 'ETF / ETC (diversificado)' : (PROFILES[p.ticker]?.finnhubIndustry || 'sem dados (abre a página da ação)');
  const country = p => isEtf(p.ticker) ? 'ETF (vários)' : (PROFILES[p.ticker]?.country || 'sem dados');
  const warns = [];
  ps.forEach(p => { const w = p.valueEUR / total * 100; if (!isEtf(p.ticker) && w > RISK_RULES.weightHigh) warns.push(`🟡 <b>${esc(p.ticker)}</b> pesa ${fmtPct(w, 0, false)} das posições (limiar: ${RISK_RULES.weightHigh}% numa só ação). Se correr mal, afeta muito a carteira.`); });
  group(sector).forEach(([k, v]) => { const w = v / total * 100; if (!k.startsWith('ETF') && !k.startsWith('sem') && w > 40) warns.push(`🟡 O setor <b>${esc(k)}</b> pesa ${fmtPct(w, 0, false)} (limiar: 40%).`); });
  const usd = sum(ps.filter(p => p.ccy === 'USD'), p => p.valueEUR) / total * 100;
  if (usd > 80) warns.push(`🔵 ${fmtPct(usd, 0, false)} está em dólares: tens ${term('risco-cambial', 'risco cambial')} elevado (normal em ações dos EUA, mas convém saber).`);
  return `${warns.length ? `<div class="card"><h3>Avisos de ${term('concentracao', 'concentração')}</h3>${warns.map(w => `<div class="flag"><div>${w}</div></div>`).join('')}</div>` : `<div class="callout ok small">✓ Sem concentração excessiva segundo as regras da MJIA (ação > ${RISK_RULES.weightHigh}%, setor > 40%).</div>`}
  <div class="grid g2m"><div class="card"><h3>Por posição</h3>${bars(ps.map(p => [p.ticker + ' · ' + BLOCKS[p.block].name, p.valueEUR]))}</div>
  <div class="card"><h3>Por bloco</h3>${bars(group(p => BLOCKS[p.block].name))}<h3 style="margin-top:14px">Por moeda</h3>${bars(group(p => p.ccy))}</div>
  <div class="card"><h3>Por ${term('setor', 'setor')}</h3>${bars(group(sector))}</div><div class="card"><h3>Por país</h3>${bars(group(country))}</div></div>
  <div class="src">Pesos calculados sobre as posições com preço (sem a liquidez). Setor e país: perfil Finnhub em cache.</div>`;
}

/* ---------- gráfico SVG ---------- */
function drawChart(el, pts, range, ccy) {
  if (!pts?.length) { el.innerHTML = '<div class="empty small">sem dados</div>'; return; }
  const lastD = Date.parse(pts[pts.length - 1][0]);
  const days = { '1M': 31, '6M': 183, '1A': 366, '5A': 99999 }[range];
  let P = pts.filter(p => Date.parse(p[0]) >= lastD - days * DAY);
  if (P.length < 2) { el.innerHTML = '<div class="empty small">Poucos pontos para este período.</div>'; return; }
  const step = Math.ceil(P.length / 400); if (step > 1) P = P.filter((_, i) => i % step === 0 || i === P.length - 1);
  const W = 600, H = 220, n = P.length, vs = P.map(p => p[1]);
  const mn = Math.min(...vs), mx = Math.max(...vs), span = mx - mn || 1;
  const X = i => i / (n - 1) * W, Y = v => H - 12 - (v - mn) / span * (H - 30);
  const d = P.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const ch = (vs[n - 1] / vs[0] - 1) * 100, col = ch >= 0 ? 'var(--green)' : 'var(--red)';
  el.innerHTML = `<div class="row between" style="margin-bottom:6px">${pill(ch, `${fmtPct(ch)} em ${range}`)}<span class="small muted">${fmtDate(P[0][0])} → ${fmtDate(P[n - 1][0])}</span></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Gráfico de preço"><defs><linearGradient id="gfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${ch >= 0 ? '#2fd27a' : '#ff5a5f'}" stop-opacity=".28"/><stop offset="1" stop-color="${ch >= 0 ? '#2fd27a' : '#ff5a5f'}" stop-opacity="0"/></linearGradient></defs>
  <path d="${d}L${W},${H}L0,${H}Z" fill="url(#gfill)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/><line id="cx" x1="0" x2="0" y1="0" y2="${H}" stroke="#8a93a8" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" visibility="hidden"/></svg>
  <span class="yl" style="top:4px">${fmtMoney(mx, ccy)}</span><span class="yl" style="bottom:4px">${fmtMoney(mn, ccy)}</span><div class="hov hidden"></div></div>`;
  const box = $('.chart', el), svg = $('svg', el), hov = $('.hov', el), cx = $('#cx', el);
  const move = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(n - 1, Math.round(x / r.width * (n - 1))));
    const px = X(i) / W * r.width;
    cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.setAttribute('visibility', 'visible');
    hov.classList.remove('hidden'); hov.textContent = `${fmtDate(P[i][0])} · ${fmtMoney(P[i][1], ccy)}`;
    hov.style.left = Math.max(60, Math.min(r.width - 60, px)) + 'px';
  };
  const leave = () => { hov.classList.add('hidden'); cx.setAttribute('visibility', 'hidden'); };
  box.addEventListener('pointermove', move); box.addEventListener('pointerdown', move); box.addEventListener('pointerleave', leave);
  box.addEventListener('touchmove', move, { passive: true }); box.addEventListener('touchend', leave);
}

    <label class="f full"><span>Nota (opcional): porquê esta operação?</span><input class="in" name="note" maxlength="240" value="${esc(v.note || '')}" placeholder="ex.: DCA mensal; acredito no crescimento da cloud"></label>
  </div><div id="txp" class="callout small"></div><div id="txe" class="err"></div>
  <button class="btn full" style="margin-top:10px">${ed ? 'Guardar alterações' : 'Guardar'}</button></form>
  <datalist id="tkl">${tickers.map(t => `<option value="${esc(t)}">`).join('')}</datalist>`;
  openSheet(ed ? 'Editar operação' : 'Registar compra ou venda', html, {
    onMount: (el, close) => {
      const f = $('#txf', el), F = n => f.elements[n];
      let k = v.kind;
      wireSeg(el, 'kind', x => { k = x; upd(); });
      const read = () => ({ ticker: F('ticker').value.trim().toUpperCase(), broker: F('broker').value, block: F('block').value, date: F('date').value, qty: pnum(F('qty').value), price: pnum(F('price').value), ccy: F('ccy').value, fees: F('fees').value.trim() === '' ? 0 : pnum(F('fees').value), feesCcy: F('feesCcy').value, eurusd: pnum(F('eurusd').value), note: F('note').value.trim() });
      function upd() {
        const x = read(), demo = x.broker.includes('demo');
        $('#blkf', el).classList.toggle('hidden', demo);
        const needFx = x.ccy === 'USD' || (x.fees > 0 && x.feesCcy === 'USD');
        $('#fxf', el).classList.toggle('hidden', !needFx);
        let p = '';
        if (isNum(x.qty) && isNum(x.price) && x.qty > 0 && x.price > 0) {
          const gross = x.qty * x.price, r = x.ccy === 'EUR' ? 1 : x.eurusd;
          const feeE = x.fees > 0 ? (x.feesCcy === 'EUR' ? x.fees : x.fees / x.eurusd) : 0;
          const eur = isNum(r) && r > 0 ? gross / r : null;
          p = `Total: <b>${fmtMoney(gross, x.ccy)}</b>${x.ccy === 'USD' && eur != null ? ` ≈ <b>${fmtEUR(eur)}</b>` : ''}${feeE ? ` · comissão ≈ ${fmtEUR(feeE)}` : ''}`;
          if (eur != null && feeE && k === 'buy') p += ` · a comissão pesa <b>${fmtPct(feeE / eur * 100, 1, false)}</b>${feeE / eur > 0.02 ? ' 🟡 (muito alta para este montante)' : ''}`;
          if (k === 'sell' && validTicker(x.ticker)) { const held = heldQty(x.ticker, demo ? 'longo' : x.block, demo, editId); p += `<br>Tens ${fmtQty(held)} ${x.ticker} neste ${demo ? 'portefólio demo' : 'bloco'}.`; }
          if (k === 'buy' && !demo && eur != null) { const B = computePortfolio({ excludeTx: editId }).blocks[x.block]; const after = B.cash - eur - feeE; if (after < -0.005) p += `<br>🟡 A ${term('cash', 'liquidez')} do bloco ficaria em ${fmtEUR(after)}. Registaste o reforço? (Carteira → + Reforço)`; }
        }
        $('#txp', el).innerHTML = p || 'Preenche a quantidade e o preço para veres o total em euros.';
      }
      f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
      $('#bce', el).onclick = async () => {
        const d = F('date').value; if (!d) return;
        $('#fxh', el).textContent = 'A obter a taxa do BCE…';
        try { const r = await getFxOn(d); F('eurusd').value = valStr(r4(r.rate)); $('#fxh', el).innerHTML = `Taxa ${term('taxa-bce', 'BCE')} de ${fmtDate(r.date)} (${d !== r.date ? 'último dia útil anterior; ' : ''}fonte: Frankfurter). A corretora pode ter usado outra.`; upd(); }
        catch (e) { $('#fxh', el).innerHTML = `Não foi possível obter a taxa (${esc(e.human || 'erro')}). Escreve-a à mão.`; }
      };
      f.onsubmit = e => {
        e.preventDefault();
        const x = read(), demo = x.broker.includes('demo'), errs = [];
        if (!validTicker(x.ticker)) errs.push('Ticker inválido (só letras, números, ponto ou hífen).');
        if (!x.date || x.date > todayISO()) errs.push('Data inválida (não pode ser no futuro).');
        if (!(x.qty > 0)) errs.push('A quantidade tem de ser maior do que zero.');
        if (!(x.price > 0)) errs.push('O preço tem de ser maior do que zero.');
        if (!(x.fees >= 0)) errs.push('Comissões inválidas.');
        const needFx = x.ccy === 'USD' || (x.fees > 0 && x.feesCcy === 'USD');
        if (needFx && !(x.eurusd > 0.5 && x.eurusd < 2.5)) errs.push('Câmbio inválido: escreve quantos dólares vale 1 euro (ex.: 1,08).');
        const block = demo ? 'longo' : x.block;
        if (k === 'sell' && !errs.length) {
          const held = heldQty(x.ticker, block, demo, editId);
          if (x.qty > held + 1e-9) errs.push(`Não podes vender ${fmtQty(x.qty)}: só tens ${fmtQty(held)} ${x.ticker} ${demo ? 'na conta demo' : 'neste bloco'}.`);
          const P = computePortfolio({ demo, excludeTx: editId }), pos = P.positions.find(p => p.ticker === x.ticker && p.block === block);
          if (pos && pos.ccy !== x.ccy) errs.push(`Esta posição foi comprada em ${pos.ccy}: regista a venda na mesma moeda.`);
        }
        if (errs.length) { $('#txe', el).innerHTML = errs.map(esc).join('<br>'); return; }
        const tx = { id: ed?.id || uid(), createdAt: ed?.createdAt || new Date().toISOString(), kind: k, ticker: x.ticker, broker: x.broker, demo, block, date: x.date, qty: x.qty, price: x.price, ccy: x.ccy, fees: x.fees || 0, feesCcy: x.feesCcy, eurusd: needFx ? x.eurusd : null, note: x.note };
        if (ed) state.tx[state.tx.findIndex(t => t.id === ed.id)] = tx; else state.tx.push(tx);
        save(); close(); toast(ed ? 'Operação atualizada' : `${k === 'buy' ? 'Compra' : 'Venda'} de ${x.ticker} registada`);
        const w = computePortfolio({ demo }).warnings; if (w.length) setTimeout(() => toast('🟡 ' + w[0].msg, 5000), 2700);
        rerender();
      };
    },
  });
}

  openSheet(ed ? 'Editar movimento' : 'Movimento de dinheiro', html, {
    onMount: (el, close) => {
      const f = $('#cf', el), F = n => f.elements[n]; let k = v.kind;
      wireSeg(el, 'ck', x => { k = x; upd(); });
      function upd() {
        $('#cb', el).classList.toggle('hidden', k === 'transfer'); $('#cfr', el).classList.toggle('hidden', k !== 'transfer'); $('#cto', el).classList.toggle('hidden', k !== 'transfer');
        const a = pnum(F('amount').value), P = computePortfolio(), cap = state.settings.highRiskCap; let w = [];
        const old = ed ? ed : null;
        if (a > 0) {
          const intoAlto = (k === 'deposit' && F('block').value === 'alto') || (k === 'transfer' && F('to').value === 'alto');
          let alloc = P.blocks.alto.allocated;
          if (old) alloc -= (old.kind === 'deposit' && old.block === 'alto' ? old.amount : 0) + (old.kind === 'transfer' && old.to === 'alto' ? old.amount : 0) - (old.kind === 'transfer' && old.from === 'alto' ? old.amount : 0) - (old.kind === 'withdraw' && old.block === 'alto' ? old.amount : 0);
          if (intoAlto && alloc + a > cap) w.push(`🟡 O capital alocado ao alto risco passaria a ${fmtEUR(alloc + a)}, acima do limite de ${fmtEUR(cap)} que definiste. Estás a decidir com calma ou a tentar recuperar uma perda ou chegar mais depressa a um objetivo?`);
          const src = k === 'withdraw' ? F('block').value : k === 'transfer' ? F('from').value : null;
          if (src && !old && a > P.blocks[src].cash + 0.005) w.push(`🟡 A ${term('cash', 'liquidez')} de ${BLOCKS[src].name} é ${fmtEUR(P.blocks[src].cash)}. Para mover mais do que isso, regista primeiro a venda das ações.`);
        }
        $('#cp', el).innerHTML = w.map(x => `<div class="callout warn">${x}</div>`).join('');
      }
      f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
      f.onsubmit = e => {
        e.preventDefault();
        const a = pnum(F('amount').value), d = F('date').value, errs = [];
        if (!(a > 0)) errs.push('O valor tem de ser maior do que zero.');
        if (!d || d > todayISO()) errs.push('Data inválida.');

        const m = { id: ed?.id || uid(), createdAt: ed?.createdAt || new Date().toISOString(), kind: k, amount: Math.round(a * 100) / 100, date: d, note: F('note').value.trim() };
        if (k === 'transfer') { m.from = F('from').value; m.to = F('to').value; } else m.block = F('block').value;
        if (ed) state.cash[state.cash.findIndex(x => x.id === ed.id)] = m; else state.cash.push(m);
        save(); close(); toast('Movimento registado'); rerender();
      };
    },
  });
}

function scrDefinicoes() {
  const cs = cacheStats();
  const keyRow = api => { const A = APIS[api]; return `<label class="f"><span>${A.name} <span class="muted small">· ${A.limit}</span></span><div class="row"><input class="in" type="password" autocomplete="off" spellcheck="false" data-key="${api}" value="${esc(KEYS[api] || '')}" placeholder="${KEYS[api] ? '' : 'cola aqui a chave'}"><button type="button" class="btn sec sm" data-show="${api}" aria-label="Mostrar">👁</button><button type="button" class="btn sec sm" data-test="${api}">Testar</button></div><div class="hint" id="kt-${api}">Obter chave gratuita: <a href="${A.signup}" target="_blank" rel="noopener">${A.signup.replace('https://', '')}</a></div></label>`; };
  const uRow = api => { const A = APIS[api], u = usedToday(api), e = usage.err[api]; return `<tr><td>${A.name}</td><td class="n">${u}${A.perDay ? ' / ' + A.perDay : ''}</td><td class="n">${minuteCount(api)}${A.perMin ? ' / ' + A.perMin : ''}</td><td class="small">${e ? `${esc(new ApiError(e.code, api).human)} <span class="muted">(${fmtDT(e.at)})</span>` : '—'}</td></tr>${A.perDay ? `<tr><td colspan="4" style="border:0;padding-top:0"><div class="bar" style="height:6px"><i class="${u >= A.perDay - A.reserve ? 'y' : ''}" style="width:${Math.min(100, u / A.perDay * 100)}%"></i></div></td></tr>` : ''}`; };
  const g = state.settings.goal;
  const h = `<h2 style="margin-bottom:12px">Definições</h2>
  <div class="card"><h3>🔑 Chaves das APIs</h3>
    <div class="callout warn small">As chaves ficam guardadas <b>só neste dispositivo</b> (no browser) e nunca no código. Não partilhes capturas de ecrã deste ecrã nem backups que incluam chaves. Em cada dispositivo novo cola-as outra vez (ou importa um backup com chaves).</div>
    ${keyRow('finnhub')}${keyRow('fmp')}${keyRow('av')}
    <p class="small muted">A taxa de câmbio vem do BCE através da Frankfurter e não precisa de chave. O "Testar" gasta 1 pedido.</p>
    <button class="btn" id="savekeys">Guardar chaves</button></div>

  <div class="card"><h3>📶 Consumo das APIs (hoje, UTC)</h3><div class="tblwrap"><table class="tbl"><tr><th>API</th><th class="n">Hoje</th><th class="n">Último min.</th><th>Último erro</th></tr>${['finnhub', 'fmp', 'av', 'fx'].map(uRow).join('')}</table></div>
    <p class="small muted">${term('cache', 'Cache')}: ${cs.n} registos (${fmtNum(cs.kb, 0)} KB). Duração: cotações 5 min · métricas, gráfico e calendário 1 dia · perfis 1 semana · câmbio 1 h. Na FMP e na Alpha Vantage, os últimos pedidos do dia ficam reservados à tua carteira. Os contadores são por dispositivo: se usares o PC e o iPhone no mesmo dia, o consumo real é a soma dos dois.</p>
    <div class="btns"><button class="btn sec sm" id="clrc">Limpar cache</button></div></div>

  <div class="card"><h3>💾 Backup</h3><p class="small muted">Os dados vivem no browser de cada dispositivo. Para passar a carteira do PC para o iPhone (ou vice-versa): <b>Exportar</b> num, <b>Importar</b> no outro. Último backup: ${state.settings.lastExport ? fmtDT(Date.parse(state.settings.lastExport)) : 'nunca'}.</p>
    <label class="row small" style="margin:8px 0"><input type="checkbox" id="inck"> Incluir as chaves das APIs (só se o ficheiro ficar contigo)</label>
    <div class="btns"><button class="btn" id="exp">⬇️ Exportar ficheiro</button><button class="btn sec" id="copy">📋 Copiar JSON</button></div>
    <div style="margin-top:12px"><label class="f"><span>Importar de ficheiro</span><input class="in" type="file" id="impf" accept=".json,application/json"></label>
    <details><summary class="small" style="cursor:pointer">…ou colar o texto JSON</summary><textarea class="in" id="impt" placeholder='{"app":"MJIA", …}'></textarea><button class="btn sec sm" id="impb" style="margin-top:6px">Importar texto</button></details></div>
    <div id="bkmsg" class="small" style="margin-top:8px"></div></div>

  <div class="card"><div class="card-h"><h3>🎿 Objetivo e limites</h3><button class="btn ghost sm" data-act="goal">Editar</button></div><p class="small">${esc(g.name)}: <b>${fmtEUR(g.target, 0)}</b> até ${fmtDate(g.date)} · limite do alto risco: <b>${fmtEUR(state.settings.highRiskCap, 0)}</b></p></div>

  <div class="card"><h3>📋 Lista de ações (núcleo)</h3><p class="small muted">Universo que a MJIA acompanha (não é uma recomendação). As ações da tua carteira entram sempre.</p>
    <form class="row wrap" id="uadd" style="gap:6px"><input class="in" name="t" placeholder="Ticker" autocapitalize="characters" style="flex:1;min-width:90px"><select class="in" name="c" style="flex:2;min-width:150px">${CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select><button class="btn sm">Adicionar</button></form>
    <div class="list" style="margin-top:8px">${CATEGORIES.map(c => state.universe.filter(u => u.cat === c.id).map(u => `<div class="li" style="cursor:default;min-height:44px;padding:6px 2px"><b style="width:64px">${esc(u.t)}</b><select class="in" data-ucat="${esc(u.t)}" style="flex:1;min-height:36px;padding:6px 8px;font-size:14px">${CATEGORIES.map(cc => `<option value="${cc.id}" ${cc.id === u.cat ? 'selected' : ''}>${cc.icon} ${cc.name}</option>`).join('')}</select><button class="btn sec sm" data-udel="${esc(u.t)}" aria-label="Remover ${esc(u.t)}">✕</button></div>`).join('')).join('')}</div>
    <button class="btn ghost sm" id="ureset">Repor a lista inicial</button></div>

  <div class="card"><div class="card-h"><h3>🔔 Notificações (ntfy)</h3><span class="soon">V4</span></div><p class="small muted">Tópico aleatório, notificação só com o emoji e a cor; configuração passo a passo na Versão 4.</p></div>

  <div class="card"><h3>ℹ️ Fontes de dados</h3><table class="mini"><tr><th>Fonte</th><th>Para quê</th></tr>
    <tr><td>Finnhub</td><td>Cotações, perfil, métricas, concorrentes, calendário de resultados</td></tr>
    <tr><td>Financial Modeling Prep</td><td>Histórico de preços (gráfico, volatilidade), dividendos, perfil detalhado</td></tr>
    <tr><td>Alpha Vantage</td><td>Reserva do gráfico (semanal) e preços de títulos fora dos EUA</td></tr>
    <tr><td>Frankfurter (BCE)</td><td>Câmbio EUR/USD de referência</td></tr>
    <tr><td>MJIA</td><td>Textos educativos, equivalentes UCITS, cálculos (FIFO, câmbio, volatilidade)</td></tr></table>
    <p class="small muted">Limites gratuitos confirmados em ${CONTENT_DATE}: Finnhub 60/min (histórico de preços e dividendos são pagos); FMP 250/dia; Alpha Vantage 25/dia. Os limites mudam: se uma API deixar de responder, o motivo aparece em "Consumo".</p></div>

  <div class="card"><h3>⚠️ Zona de perigo</h3><p class="small muted">Apaga todos os dados deste dispositivo (carteira, progresso, cache). Faz um backup antes.</p><button class="btn danger" id="wipe">Apagar todos os dados</button></div>`;
  return { html: h, mount: mountDefs };
}
function mountDefs() {
  const v = $('#view');
  $$('[data-show]', v).forEach(b => b.onclick = () => { const i = $(`[data-key=${b.dataset.show}]`, v); i.type = i.type === 'password' ? 'text' : 'password'; });
  const collect = () => { const k = { ...KEYS }; $$('[data-key]', v).forEach(i => { const x = i.value.trim(); if (x) k[i.dataset.key] = x; else delete k[i.dataset.key]; }); return k; };
  $('#savekeys').onclick = () => { saveKeys(collect()); toast('Chaves guardadas neste dispositivo'); $('#banners').innerHTML = banners(); };
  $$('[data-test]', v).forEach(b => b.onclick = async () => {
    saveKeys(collect()); const api = b.dataset.test, out = $('#kt-' + api); out.textContent = 'A testar…';
    try {
      let r;
      if (api === 'finnhub') r = await getQuote('AAPL', PRIO.portfolio, true);
      else if (api === 'fmp') r = await apiGet('fmp', '/profile', { symbol: 'AAPL' }, { ck: 'fpf:AAPL', ttl: 0, force: true, prio: PRIO.portfolio, validate: d => Array.isArray(d) && d.length > 0 });
      else r = await apiGet('av', '', { function: 'GLOBAL_QUOTE', symbol: 'IBM' }, { ck: 'avtest', ttl: 0, force: true, prio: PRIO.portfolio, validate: d => d && d['Global Quote'] });
      if (r.stale) throw r.err;
      out.innerHTML = `<span class="up">✓ Funciona</span> · resposta às ${fmtDT(r.at)}`;
    } catch (e) { out.innerHTML = `<span class="down">✗ ${esc(e.human || e.message)}</span>`; }
  });
  $('#clrc').onclick = () => { clearCache(); for (const k in QUOTES) delete QUOTES[k]; toast('Cache limpa'); rerender(); };
  const json = () => JSON.stringify({ app: 'MJIA', schema: 1, version: APP_VERSION, exportedAt: new Date().toISOString(), data: state, ...($('#inck').checked ? { keys: KEYS } : {}) }, null, 1);
  const markExp = () => { state.settings.lastExport = new Date().toISOString(); save(); };
  $('#exp').onclick = () => {
    try { const b = new Blob([json()], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `mjia-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); markExp(); $('#bkmsg').innerHTML = '✓ Ficheiro gerado. Se não apareceu nenhuma transferência (alguns ambientes bloqueiam), usa "Copiar JSON".'; }
    catch (e) { $('#bkmsg').textContent = 'Não foi possível gerar o ficheiro: usa "Copiar JSON".'; }
  };
  $('#copy').onclick = async () => {
    const j = json();
    try { await navigator.clipboard.writeText(j); markExp(); $('#bkmsg').innerHTML = '✓ JSON copiado. Cola-o num ficheiro ou numa nota segura.'; }
    catch (e) { $('#bkmsg').innerHTML = `Não deu para copiar automaticamente. Seleciona e copia:<textarea class="in" readonly style="margin-top:6px">${esc(j)}</textarea>`; markExp(); }
  };
  const doImport = async txt => {
    let o; try { o = JSON.parse(txt); } catch (e) { $('#bkmsg').innerHTML = '<span class="down">Ficheiro inválido (não é JSON).</span>'; return; }
    if (!o || o.app !== 'MJIA' || !o.data || typeof o.data !== 'object') { $('#bkmsg').innerHTML = '<span class="down">Este ficheiro não é um backup da MJIA.</span>'; return; }
    const d = o.data;
    const ok = await confirmBox(`Importar o backup de ${fmtDT(Date.parse(o.exportedAt))}?<br><br>${(d.tx || []).length} operações · ${(d.cash || []).length} movimentos · ${(d.savings || []).length} poupanças${o.keys ? ' · inclui chaves' : ''}.<br><br><b>Substitui</b> os dados atuais deste dispositivo.`, { ok: 'Importar' });
    if (!ok) return;
    state = migrate(d); save(); if (o.keys && typeof o.keys === 'object') saveKeys(o.keys);
    toast('Backup importado ✓'); go('inicio');
  };
  $('#impf').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f); e.target.value = ''; };
  $('#impb').onclick = () => doImport($('#impt').value);
  $('#uadd').onsubmit = e => {
    e.preventDefault(); const t = e.target.elements.t.value.trim().toUpperCase(), c = e.target.elements.c.value;
    if (!validTicker(t)) return toast('Ticker inválido'); if (inUniverse(t)) return toast(`${t} já está na lista`);
    state.universe.push({ t, cat: c, kind: c === 'etf' ? 'etf' : 'stock' }); save(); toast(`${t} adicionada`); rerender();
  };
  $$('[data-ucat]', v).forEach(s => s.onchange = () => { const u = inUniverse(s.dataset.ucat); u.cat = s.value; if (s.value === 'etf') u.kind = 'etf'; save(); toast('Categoria atualizada'); });
  $$('[data-udel]', v).forEach(b => b.onclick = () => { state.universe = state.universe.filter(u => u.t !== b.dataset.udel); save(); rerender(); });
  $('#ureset').onclick = async () => { if (await confirmBox('Repor a lista inicial de ~40 títulos? As tuas alterações à lista perdem-se (a carteira não é afetada).', { ok: 'Repor' })) { state.universe = UNIVERSE_DEFAULT.map(u => ({ ...u })); save(); rerender(); } };
  $('#wipe').onclick = () => openSheet('Apagar todos os dados', `<p>Escreve <b>APAGAR</b> para confirmar.</p><input class="in" id="wt" autocomplete="off"><label class="row small" style="margin:10px 0"><input type="checkbox" id="wk" checked> Manter as chaves das APIs</label><button class="btn danger full" id="wb" disabled>Apagar tudo</button>`, {
    onMount: (el) => {
      $('#wt', el).oninput = e => $('#wb', el).disabled = e.target.value.trim() !== 'APAGAR';
      $('#wb', el).onclick = () => { const keep = $('#wk', el).checked; LS.del(K_DATA); LS.del(K_USAGE); clearCache(); if (!keep) LS.del(K_KEYS); location.hash = 'inicio'; location.reload(); };
    },
  });
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
